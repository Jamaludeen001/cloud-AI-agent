<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Agent</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b;
      --border: #2a2f3a; --text: #e6e8ee; --muted: #8b93a7;
      --accent: #4f8cff; --user: #2a3a5c; --bot: #1e222b;
      --error: #5c2a2a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
    }
    .app {
      display: flex; flex-direction: column; height: 100vh;
      max-width: 900px; margin: 0 auto;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header .actions { display: flex; gap: 8px; }
    button {
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 12px; font-size: 13px; cursor: pointer;
    }
    button:hover { background: var(--border); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    button.primary:hover { background: #3d7ce6; }

    #data-status {
      padding: 8px 16px; background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      font-size: 13px; color: var(--muted);
    }
    #data-status[hidden] { display: none; }

    #chat-window {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 14px;
    }
    #chat-empty {
      color: var(--muted); text-align: center;
      margin: auto; max-width: 400px; font-size: 14px; line-height: 1.6;
    }
    .chat-msg {
      max-width: 80%; padding: 10px 14px; border-radius: 10px;
      line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
    }
    .chat-msg.user { align-self: flex-end; background: var(--user); }
    .chat-msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); }
    .chat-msg.error { background: var(--error); border-color: #7a3a3a; }
    .chat-msg.thinking { color: var(--muted); font-style: italic; }

    .chat-sources {
      margin-top: 8px; border-top: 1px solid var(--border);
      padding-top: 8px; font-size: 12px;
    }
    .chat-sources summary { cursor: pointer; color: var(--muted); }
    .chat-sources pre {
      background: var(--panel); padding: 8px; border-radius: 4px;
      overflow-x: auto; margin: 6px 0 0; font-size: 11px;
      line-height: 1.4; white-space: pre-wrap;
    }

    #chat-input-row {
      display: flex; gap: 8px; padding: 12px 16px;
      border-top: 1px solid var(--border); background: var(--panel);
    }
    #chat-input {
      flex: 1; background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 10px 12px; font-size: 14px; outline: none;
    }
    #chat-input:focus { border-color: var(--accent); }

    #attach-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    #attach-modal[hidden] { display: none; }
    .modal {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; width: 90%; max-width: 500px; padding: 20px;
    }
    .modal h2 { margin: 0 0 16px; font-size: 16px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .tab-btn {
      flex: 1; padding: 8px; font-size: 13px;
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer; color: var(--muted);
    }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
    .tab-panel { display: flex; flex-direction: column; gap: 8px; }
    .tab-panel label { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .tab-panel input, .tab-panel textarea {
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 10px; font-size: 13px; font-family: inherit; outline: none;
    }
    .tab-panel input:focus, .tab-panel textarea:focus { border-color: var(--accent); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .status-line { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 16px; }
    .status-line.ok { color: #6dd58c; }
    .status-line.error { color: #ff7b7b; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>RAG Agent</h1>
      <div class="actions">
        <button id="attach-btn">+ Attach data</button>
        <button id="clear-data-btn">Clear</button>
      </div>
    </header>

    <div id="data-status" hidden>
      <span>Attached: <strong id="data-status-value"></strong></span>
    </div>

    <div id="chat-window">
      <div id="chat-empty">
        Attach a URL, file, or pasted text — then ask questions about it.
        <br /><br />
        Try: <em>"hi"</em> · <em>"summarize what we discussed"</em>
      </div>
    </div>

    <div id="chat-input-row">
      <input id="chat-input" type="text" placeholder="Ask anything..." autocomplete="off" />
      <button id="chat-send" class="primary">Send</button>
    </div>
  </div>

  <div id="attach-modal" hidden>
    <div class="modal">
      <h2>Attach data</h2>
      <div class="tabs">
        <button class="tab-btn active" data-mode="url">URL</button>
        <button class="tab-btn" data-mode="file">File</button>
        <button class="tab-btn" data-mode="paste">Paste</button>
      </div>
      <div id="panel-container" class="tab-panel"></div>
      <div id="attach-status" class="status-line"></div>
      <div class="modal-actions">
        <button id="attach-cancel">Cancel</button>
        <button id="attach-submit" class="primary">Load</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
