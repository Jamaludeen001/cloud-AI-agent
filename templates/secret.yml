  AppSecretResourcePolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      BlockPublicPolicy: true
      SecretId: !Ref AppSecret
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          # 🚨 FIX 1: Allow CloudFormation to manage the secret policy 🚨
          - Sid: AllowCloudFormationToManage
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:role/CloudFormationServiceRole'
            Action: 'secretsmanager:*'
            Resource: '*'
          # 🚨 FIX 2: Allow the root account (admin) to manage 🚨
          - Sid: AllowRootToManage
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'secretsmanager:*'
            Resource: '*'
          # Allow your ECS role to read
          - Sid: AllowECSRolesToRead
            Effect: Allow
            Principal:
              AWS: !Ref AllowedRoleArns
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: '*'
          # Deny everyone else
          - Sid: DenyAllOtherAccess
            Effect: Deny
            Principal: '*'
            Action: 'secretsmanager:*'
            Resource: '*'
            Condition:
              StringNotEquals:
                aws:PrincipalArn: 
                  - !Ref AllowedRoleArns
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/CloudFormationServiceRole'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:root'
