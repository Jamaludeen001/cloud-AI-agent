AWSTemplateFormatVersion: '2010-09-09'
Description: 'Enterprise AWS Secrets Manager with KMS Encryption and Resource Policy'

Parameters:
  SecretName:
    Type: String
    Description: 'Name of the secret'
    Default: 'main-agentic-app/secrets'
  
  SecretString:
    Type: String
    Description: 'JSON string containing the secret values'
    NoEcho: true

  AllowedRoleArns:
    Type: CommaDelimitedList
    Description: 'Comma-separated list of IAM Role ARNs allowed to access the secret'

Resources:
  SecretKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: 'KMS Key for Main Agentic App Secrets Manager'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowSecretsManager
            Effect: Allow
            Principal:
              Service: secretsmanager.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: '*'

  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref SecretName
      Description: "API Keys and Database credentials for the Main Agentic App"
      SecretString: !Ref SecretString
      KmsKeyId: !GetAtt SecretKmsKey.Arn

  AppSecretResourcePolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      BlockPublicPolicy: true
      SecretId: !Ref AppSecret
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowECSRolesToRead
            Effect: Allow
            Principal:
              AWS: !Ref AllowedRoleArns
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: '*'
          - Sid: DenyAllOtherAccess
            Effect: Deny
            Principal: '*'
            Action: 'secretsmanager:*'
            Resource: '*'
            Condition:
              # 🚨 Fixed: Using ForAnyValue:StringNotEquals for CommaDelimitedList 🚨
              ForAnyValue:StringNotEquals:
                aws:PrincipalArn: !Ref AllowedRoleArns

Outputs:
  SecretArn:
    Description: The ARN of the created secret
    Value: !Ref AppSecret