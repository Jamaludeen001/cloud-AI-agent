AWSTemplateFormatVersion: '2010-09-09'
Description: 'Generic AI Microservice on ECS Fargate with CloudWatch logging, alarms & DynamoDB'

Parameters:
  ServiceName:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  ImageUri:
    Type: String
  ContainerPort:
    Type: Number
    Default: 8080
  SecretArn:
    Type: String
    Default: ""
  KmsKeyArn:
    Type: String
    Default: ""
  EmbedderUrl:
    Type: String
    Default: ""
  GuardrailUrl:
    Type: String
    Default: ""
  LLMProvider:
    Type: String
    Default: ""
  LLMModel:
    Type: String
    Default: ""
  MaxLlmCalls:
    Type: String
    Default: "4"
  MaxTokens:
    Type: String
    Default: "8000"
  MaxSeconds:
    Type: String
    Default: "30"
  TopKRetrieve:
    Type: String
    Default: "10"
  TopKRerank:
    Type: String
    Default: "5"
  RerankThreshold:
    Type: String
    Default: "200"
  DefaultTimeout:
    Type: String
    Default: "30"
  MaxBytes:
    Type: String
    Default: "5000000"
  # ---- Alerting params ----
  AlarmEmail:
    Type: String
    Description: Email address to receive alarm notifications
  LogRetentionDays:
    Type: Number
    Default: 14
  ErrorThreshold:
    Type: Number
    Default: 5
    Description: Number of ERROR log lines in 5 minutes before alarming
  EnableContainerInsights:
    Type: String
    Default: "enabled"
    AllowedValues: [enabled, disabled]
  # ---- DynamoDB Logging Params ----
  DynamoTableName:
    Type: String
    Default: "AgentChatLogs"
    Description: The name of the DynamoDB table to store chat logs

Conditions:
  HasSecret: !Not [!Equals [!Ref SecretArn, ""]]

Resources:
  # =========================================================
  # DynamoDB Table for Chat Logs (COMMENTED OUT - USING EXISTING)
  # =========================================================
  # ChatLogsTable:
  #   Type: AWS::DynamoDB::Table
  #   Properties:
  #     TableName: !Ref DynamoTableName
  #     BillingMode: PAY_PER_REQUEST
  #     AttributeDefinitions:
  #       - AttributeName: session_id
  #         AttributeType: S
  #       - AttributeName: timestamp
  #         AttributeType: S
  #     KeySchema:
  #       - AttributeName: session_id
  #         KeyType: HASH
  #       - AttributeName: timestamp
  #         KeyType: RANGE
  #     TimeToLiveSpecification:
  #       AttributeName: ttl
  #       Enabled: true

  # =========================================================
  # ECS Cluster
  # =========================================================
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ServiceName}-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: !Ref EnableContainerInsights

  # =========================================================
  # IAM
  # =========================================================
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ServiceName}-ExecutionRole-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: "secretsmanager:GetSecretValue"
                Resource: !If [HasSecret, !Ref SecretArn, "arn:aws:secretsmanager:us-east-1:340601547920:secret:no-secret-needed-*"]
        - PolicyName: KMSDecryptAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: "kms:Decrypt"
                Resource: !If [HasSecret, !Ref KmsKeyArn, "arn:aws:kms:us-east-1:340601547920:key/no-key-needed-*"]
        
        # Allow ECS to write logs to EXISTING DynamoDB table
        - PolicyName: DynamoDBWriteAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - "dynamodb:PutItem"
                  - "dynamodb:UpdateItem"
                # Construct ARN dynamically using the DynamoTableName parameter
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableName}"

  # =========================================================
  # CloudWatch Logs
  # =========================================================
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ServiceName}"
      RetentionInDays: !Ref LogRetentionDays

  # =========================================================
  # SNS Topic for alerts
  # =========================================================
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ServiceName}-alerts"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # =========================================================
  # Networking / ALB
  # =========================================================
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Allow HTTP to ${ServiceName} ALB"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Allow traffic from ALB to ${ServiceName} ECS"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref ALBSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # =========================================================
  # Task Definition
  # =========================================================
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn: LogGroup
    Properties:
      Family: !Sub "${ServiceName}-task"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '1024'
      Memory: '3072'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: !Sub "${ServiceName}-container"
          Image: !Ref ImageUri
          PortMappings:
            - ContainerPort: !Ref ContainerPort
          Environment:
            - Name: LLM_PROVIDER
              Value: !Ref LLMProvider
            - Name: LLM_MODEL
              Value: !Ref LLMModel
            - Name: EMBEDDER_URL
              Value: !Ref EmbedderUrl
            - Name: GUARDRAIL_URL
              Value: !Ref GuardrailUrl
            - Name: APP_ENV
              Value: "prod"
            - Name: LOG_LEVEL
              Value: "INFO"
            - Name: MAX_LLM_CALLS
              Value: !Ref MaxLlmCalls
            - Name: MAX_TOKENS
              Value: !Ref MaxTokens
            - Name: MAX_SECONDS
              Value: !Ref MaxSeconds
            - Name: TOP_K_RETRIEVE
              Value: !Ref TopKRetrieve
            - Name: TOP_K_RERANK
              Value: !Ref TopKRerank
            - Name: RERANK_THRESHOLD
              Value: !Ref RerankThreshold
            - Name: DEFAULT_TIMEOUT
              Value: !Ref DefaultTimeout
            - Name: MAX_BYTES
              Value: !Ref MaxBytes
            - Name: LANGSMITH_PROJECT
              Value: "agent-app"
            - Name: DYNAMODB_TABLE_NAME
              Value: !Ref DynamoTableName
          Secrets: !If
            - HasSecret
            - - Name: GOOGLE_API_KEY
                ValueFrom: !Sub "${SecretArn}:GOOGLE_API_KEY::"
              - Name: QDRANT_URL
                ValueFrom: !Sub "${SecretArn}:QDRANT_URL::"
              - Name: QDRANT_API_KEY
                ValueFrom: !Sub "${SecretArn}:QDRANT_API_KEY::"
              - Name: REDIS_URL
                ValueFrom: !Sub "${SecretArn}:REDIS_URL::"
            - !Ref "AWS::NoValue"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: !Sub "${ServiceName}"
          Essential: true

  ECSService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref ECSCluster
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ECSSecurityGroup
          Subnets: !Ref SubnetIds
      TaskDefinition: !Ref TaskDefinition
      LoadBalancers:
        - ContainerName: !Sub "${ServiceName}-container"
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup

  # =========================================================
  # Metric Filters
  # =========================================================
  ErrorLogMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: LogGroup
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: !Sub "${ServiceName}/App"
          MetricName: ErrorCount
          MetricValue: "1"
          DefaultValue: 0

  ExceptionLogMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: LogGroup
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: 'Exception'
      MetricTransformations:
        - MetricNamespace: !Sub "${ServiceName}/App"
          MetricName: ExceptionCount
          MetricValue: "1"
          DefaultValue: 0

  # =========================================================
  # CloudWatch Alarms
  # =========================================================
  AppErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: ErrorLogMetricFilter
    Properties:
      AlarmName: !Sub "${ServiceName}-app-errors"
      AlarmDescription: !Sub ">= ${ErrorThreshold} ERROR log lines in 5 minutes"
      Namespace: !Sub "${ServiceName}/App"
      MetricName: ErrorCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref ErrorThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  AppExceptionAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: ExceptionLogMetricFilter
    Properties:
      AlarmName: !Sub "${ServiceName}-app-exceptions"
      AlarmDescription: "Exceptions detected in application logs"
      Namespace: !Sub "${ServiceName}/App"
      MetricName: ExceptionCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  UnhealthyHostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ServiceName}-unhealthy-hosts"
      AlarmDescription: "ALB reports unhealthy targets"
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopic

  Http5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ServiceName}-alb-5xx"
      AlarmDescription: "ALB target 5xx responses detected"
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  RunningTaskCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ServiceName}-tasks-down"
      AlarmDescription: "ECS service has fewer than 1 running task (crashed / failed to start)"
      Namespace: AWS/ECS
      MetricName: RunningTaskCount
      Dimensions:
        - Name: ClusterName
          Value: !Ref ECSCluster
        - Name: ServiceName
          Value: !GetAtt ECSService.Name
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopic

  CpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ServiceName}-cpu-high"
      AlarmDescription: "ECS service CPU > 85%"
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref ECSCluster
        - Name: ServiceName
          Value: !GetAtt ECSService.Name
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  MemoryHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ServiceName}-memory-high"
      AlarmDescription: "ECS service memory > 85% (OOM risk)"
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref ECSCluster
        - Name: ServiceName
          Value: !GetAtt ECSService.Name
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

Outputs:
  ServiceURL:
    Description: The URL of the Microservice
    Value: !Sub "http://${LoadBalancer.DNSName}"

  LogGroupName:
    Description: CloudWatch log group for service logs
    Value: !Ref LogGroup

  LogGroupConsoleUrl:
    Description: Open logs in CloudWatch console
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logsV2:log-groups/log-group/${LogGroup}"

  AlertsTopicArn:
    Description: SNS topic that receives all alarms
    Value: !Ref AlertTopic

  # DynamoDBTableName commented out because resource is not created by this stack
  # DynamoDBTableName:
  #   Description: The name of the DynamoDB table for chat logs
  #   Value: !Ref ChatLogsTable
