AWSTemplateFormatVersion: '2010-09-09'
Description: 'Demo ElastiCache Redis Cluster (Single Node)'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  EcsSecurityGroupId:
    Type: String
    Description: 'Security Group ID of the ECS Main App'
  # 🚨 NEW PARAMETER 🚨
  ClusterName:
    Type: String
    Description: 'Name for the ElastiCache cluster'
    Default: 'main-app-redis'

Resources:
  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Redis traffic from ECS Main App only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref EcsSecurityGroupId

  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Subnet group for Demo Redis
      SubnetIds: !Ref SubnetIds

  RedisCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      Engine: redis
      CacheNodeType: cache.t3.micro
      NumCacheNodes: 1
      # 🚨 USE THE PARAMETER HERE 🚨
      ClusterName: !Ref ClusterName
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      VpcSecurityGroupIds:
        - !GetAtt RedisSecurityGroup.GroupId
      TransitEncryptionEnabled: false 
      AtRestEncryptionEnabled: false

Outputs:
  PrimaryEndpoint:
    Description: The endpoint for connecting to Redis
    Value: !GetAtt RedisCluster.RedisEndpoint.Address
