name: Create AWS Secret

on:
  workflow_dispatch:
    inputs:
      param_file:
        description: 'Parameter file name (e.g., main-agentic-app-secret)'
        required: true
        default: 'main-agentic-app-secret'
      secret_json:
        description: 'Paste the JSON secret values here (e.g., {"GOOGLE_API_KEY": "..."})'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  create_secret:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::340601547920:role/GitHubActionsDeployRole-CloudAIAgent
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy Secret via CloudFormation
        env:
          SECRET_JSON: ${{ github.event.inputs.secret_json }}
        run: |
          echo "::add-mask::$SECRET_JSON"
          
          PARAM_FILE="parameters/${{ github.event.inputs.param_file }}.json"
          SECRET_NAME=$(jq -r '.[] | select(.ParameterKey=="SecretName") | .ParameterValue' $PARAM_FILE)
          ALLOWED_ROLE=$(jq -r '.[] | select(.ParameterKey=="AllowedRoleArns") | .ParameterValue' $PARAM_FILE)
          
          aws cloudformation deploy \
            --template-file templates/secret.yml \
            --stack-name "${SECRET_NAME//\//-}-stack" \
            --role-arn arn:aws:iam::340601547920:role/CloudFormationServiceRole \
            --parameter-overrides \
              SecretName="$SECRET_NAME" \
              SecretString="$SECRET_JSON" \
              AllowedRoleArns="$ALLOWED_ROLE" \
            --no-fail-on-empty-changeset
          
          SECRET_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${SECRET_NAME//\//-}-stack" \
            --query 'Stacks[0].Outputs[?OutputKey==`SecretArn`].OutputValue' \
            --output text)
            
          echo "✅ Secret created successfully!"
