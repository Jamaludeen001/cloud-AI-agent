name: Deploy AI Microservice

on:
  workflow_dispatch:
    inputs:
      param_file:
        description: 'Parameter file name (e.g., embedder, guardrail, main-agentic-app)'
        required: true
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - outputs
          - delete

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Service Name
        id: extract
        run: |
          SERVICE_NAME=$(jq -r '.[] | select(.ParameterKey=="ServiceName") | .ParameterValue' parameters/${{ github.event.inputs.param_file }}.json)
          echo "SERVICE_NAME=$SERVICE_NAME" >> $GITHUB_ENV
          # Generate lowercase name for ECR
          echo "ECR_REPO_NAME=$(echo "$SERVICE_NAME" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::340601547920:role/GitHubActionsDeployRole-CloudAIAgent
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repository Exists
        env:
          ECR_REPO_NAME: ${{ env.ECR_REPO_NAME }}
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPO_NAME || \
          aws ecr create-repository --repository-name $ECR_REPO_NAME

      - name: Build, tag, and push image
        env:
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          ECR_REPO_NAME: ${{ env.ECR_REPO_NAME }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ "$SERVICE_NAME" = "main-Agentic-app" ]; then
            docker build -t $ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG .
          else
            cd ${SERVICE_NAME}_api
            docker build -t $ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG .
          fi
          
          docker push $ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPO_NAME:latest
          docker push $ECR_REGISTRY/$ECR_REPO_NAME:latest

      - name: Deploy Stack
        if: ${{ github.event.inputs.action == 'deploy' }}
        env:
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          ECR_REPO_NAME: ${{ env.ECR_REPO_NAME }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ "$SERVICE_NAME" = "main-Agentic-app" ]; then
            CONTAINER_PORT=8000
          else
            CONTAINER_PORT=8080
          fi
          
          # 1. Read the original parameter file
          PARAM_FILE="parameters/${{ github.event.inputs.param_file }}.json"
          PARAMS=$(cat $PARAM_FILE)
          
          # 2. Inject the dynamic values (ImageUri and ContainerPort) using jq
          UPDATED_PARAMS=$(echo "$PARAMS" | jq \
            --arg img "$ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG" \
            --arg port "$CONTAINER_PORT" \
            '. + [{"ParameterKey": "ImageUri", "ParameterValue": $img}, {"ParameterKey": "ContainerPort", "ParameterValue": $port}]')
            
          # 3. Write to a temporary file
          echo "$UPDATED_PARAMS" > /tmp/final-params.json
          
          # 4. Deploy using ONLY the file
          aws cloudformation deploy \
            --template-file templates/microservice.yml \
            --stack-name ${SERVICE_NAME}-stack \
            --role-arn arn:aws:iam::340601547920:role/CloudFormationServiceRole \
            --parameter-overrides file:///tmp/final-params.json \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Show Stack Outputs
        if: ${{ github.event.inputs.action == 'outputs' }}
        env:
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${SERVICE_NAME}-stack \
            --query 'Stacks[0].Outputs' \
            --output table

      - name: Delete Stack
        if: ${{ github.event.inputs.action == 'delete' }}
        env:
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
        run: |
          aws cloudformation delete-stack \
            --stack-name ${SERVICE_NAME}-stack
          echo "Delete initiated for stack: ${SERVICE_NAME}-stack"
